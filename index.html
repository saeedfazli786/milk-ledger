<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Milk Ledger Pro</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--tx:#3a2416;--mu:#8a6e5c;--pr:#b4561f;--pr2:#fbebdd;--wa:#7a3512;--ln:#ecd8c8}
:root[data-t=dark]{--bg:#1d140e;--card:#2a1d15;--tx:#f6e9de;--mu:#c2a58f;--pr:#e08a4f;--pr2:#3d2a1b;--wa:#f4b27e;--ln:#4a3626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:760px;margin:auto;padding:14px 14px 40px}
h1,h2{margin:.2em 0}h1{font-size:1.5rem}h2{font-size:1.15rem}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bar h1{flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:1.5rem;color:var(--pr)}.stat span{color:var(--mu);font-size:.85rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.o{background:var(--pr2);color:var(--pr)}button.d{background:#a32a2a}button.s{padding:6px 10px;font-size:.85rem}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.acts button{padding:18px 8px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.big{background:var(--pr2);border-radius:12px;padding:12px;text-align:center}.big b{font-size:1.6rem;color:var(--wa)}
.ad{background:var(--ln);color:var(--mu);text-align:center;padding:14px;border-radius:10px;margin-top:14px;font-size:.85rem}
.bt{height:10px;background:var(--pr);border-radius:5px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal .card{width:100%;max-width:340px}
.lgw{text-align:center;margin-bottom:10px}.lgw.lgb{margin:10px 0 36px}.lgw.lgb img{width:min(86vw,340px);height:auto}.lt{direction:ltr;display:flex;justify-content:flex-start;margin-bottom:6px}.lt select{width:auto;margin:0;padding:8px 14px;border-radius:999px;background:var(--pr2);color:var(--pr);font-weight:600;border:1px solid var(--ln)}.lgw img{animation:drop 1.7s cubic-bezier(.2,.8,.2,1) both}@keyframes drop{0%{transform:translateY(-160%) rotate(-540deg) scale(.5);opacity:0}65%{opacity:1}80%{transform:translateY(6%) rotate(12deg) scale(1.04)}100%{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){.lgw img{animation:none}}
.adfoot{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln)}.adfoot .ad{max-width:732px;margin:0 auto}
.cr{text-align:center;color:var(--mu);font-size:.78rem;margin:14px 0 0}
.mu{color:var(--mu);font-size:.85rem}.pre{white-space:pre-wrap;line-height:1.7}
@media print{.noprint,button{display:none!important}}

function unlock(){if($('#p1').value===D.pin){if(!D.rc){genRC();go('rc')}else{go(D.setup?'home':'lang');inter()}}else msg('Ghalat PIN')}
function qs(v){const r=v.trim()?D.s.filter(s=>s.name.toLowerCase().includes(v.toLowerCase())):[];$('#qr').innerHTML=r.length?`<div class=card>${r.map(s=>`<div class=row style="cursor:pointer" onclick="go('led');setTimeout(()=>{$('#lt').value='s';lf();$('#lv').value=sup('${s.id}').name;lg()},0)"><b>${s.name}</b><span class=mu>Baqaya ${f(bal(s.id))}</span></div>`).join('')}</div>`:''}
function saveSup(ed){const s={id:ed||uid(),name:$('#n').value.trim(),mobile:$('#m').value,wa:$('#w').value,addr:$('#a').value,rate:+$('#r').value};if(!s.name||!s.rate)return msg('Naam aur rate zaroori hain');if(ed)D.s[D.s.findIndex(x=>x.id==ed)]=s;else D.s.push(s);save();msg('Supplier save ho gaya');go('ss')}
async function editSup(id){if(await verify())go('sup',id)}
async function delSup(id){if(!(await yes('Supplier delete karna hai? Uski entries bhi hide ho jayengi.')))return;if(await verify()){D.s=D.s.filter(s=>s.id!=id);D.e.forEach(e=>e.sid==id&&(e.del=1));D.p.forEach(p=>p.sid==id&&(p.del=1));save();go('ss')}}
async function pick(){const s=byName($('#es').value);if(!s){$('#eb').innerHTML='';return}const id=s.id;let rate=s.rate;
if(await yes(`Rate ${f(rate)}/L hai. Kya Milk Rate Update karna hai?`)&&await verify()){const n=await ask('Naya rate','number',rate);if(n&&+n>0){s.rate=rate=+n;save()}}
const now=new Date(),pb=bal(id);$('#eb').innerHTML=`<p class=mu>${now.toLocaleDateString()} • ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} • Rate ${f(rate)}/L</p><label>Milk Quantity (litre)</label><input id=eq type=number inputmode=decimal oninput="calc(${rate},${pb})"><div class=row><span>Current Bill</span><b id=cb>0</b></div><div class=row><span>Previous Balance</span><b>${f(pb)}</b></div><div class=big>Total Amount Payable<br><b id=tp>${f(pb)}</b></div><br><button onclick="saveEntry('${id}',${rate},${pb})">Save Entry</button>`}
function calc(r,pb){const b=(+$('#eq').value||0)*r;$('#cb').textContent=f(b);$('#tp').textContent=f(b+pb)}
function saveEntry(sid,rate,pb){const q=+$('#eq').value;if(!(q>0))return msg('Quantity likhein');const b=q*rate;D.e.push({id:uid(),sid,date:today(),ts:Date.now(),qty:q,rate,bill:b,prev:pb,total:b+pb});save();msg('Entry save ho gayi');go('home')}
function savePay(sid){const a=+$('#pa').value;if(!(a>0))return msg('Sahi amount likhein');const b=bal(sid),p={id:uid(),sid,date:today(),ts:Date.now(),amt:a,method:$('#pm').value,note:$('#pn').value,before:b,after:b-a};D.p.push(p);undoE={k:'p',id:p.id};save();msg('Payment save ho gayi');go('pay',sid)}
function undo(){if(!undoE)return;const l=undoE.k=='p'?D.p:D.e,x=l.find(i=>i.id==undoE.id);if(x){if(undoE.k=='p')D.p=D.p.filter(i=>i.id!=x.id);else x.del=0}undoE=null;save();go(undoE?'home':'home')}
function lf(){const t=$('#lt').value;$('#li').innerHTML=t=='s'?sf('lv','lg()'):`<input id=lv type=${t=='d'?'date':t=='m'?'month':'number'} value="${t=='d'?today():t=='m'?today().slice(0,7):today().slice(0,4)}" onchange="lg()">`;lg()}
function lg(){const t=$('#lt').value;let v=$('#lv').value;if(t=='s'){const s0=byName(v);v=s0?s0.id:''}if(!v){$('#lr').innerHTML='<p class=mu>Filter select karein.</p>';return}
const m=d=>t=='s'?1:t=='d'?d==v:d.startsWith(t=='m'?v:v+'');const sm=(x)=>t=='s'?x.sid==v:m(x.date);
const rows=[...D.e.filter(e=>!e.del&&sm(e)).map(e=>({k:'e',...e})),...D.p.filter(p=>!p.del&&sm(p)).map(p=>({k:'p',...p}))].sort((a,b)=>b.ts-a.ts);
const nm=id=>(sup(id)||{name:'(deleted)'}).name;
window._lw=rows.map(r=>`${r.date} ${nm(r.sid)}: ${r.k=='e'?r.qty+'L = '+f(r.bill):'Paid '+f(r.amt)}`).join('\n');
$('#lr').innerHTML=`<div class=card>${t=='s'?`<div class=big>Baqaya<br><b>${f(bal(v))}</b></div>`:''}${rows.map(r=>`<div class=row><div><b>${r.k=='e'?`🥛 ${r.qty} L @ ${f(r.rate)}`:`💵 Paid ${f(r.amt)} (${r.method})`}</b><div class=mu>${r.date} • ${nm(r.sid)}${r.k=='e'?' • Total '+f(r.total):''}</div></div><button class="d s noprint" onclick="del('${r.k}','${r.id}')">Delete</button></div>`).join('')||'<p class=mu>Koi record nahi.</p>'}</div><button class=noprint onclick="window.print()">🖨 Print / PDF</button> <button class="o noprint" onclick="wa(_lw)">WhatsApp</button>`}
async function del(k,id){if(!(await verify()))return;const x=(k=='e'?D.e:D.p).find(i=>i.id==id);x.del=1;undoE={k,id};save();go('led')}
const wa=t=>window.open('https://wa.me/?text='+encodeURIComponent('Milk Ledger Pro\n'+t),'_blank');
function range(){const r=$('#rg').value,n=new Date(),d=n.toISOString().slice(0,10);return x=>{const dt=new Date(x.date);if(r=='d')return x.date==d;if(r=='w')return(n-dt)/864e5<7&&dt<=n;if(r=='m')return x.date.slice(0,7)==d.slice(0,7);return x.date.slice(0,4)==d.slice(0,4)}}
function rr(){const q=range(),es=D.e.filter(e=>!e.del&&q(e)),ps=D.p.filter(p=>!p.del&&q(p)),L=es.reduce((a,e)=>a+e.qty,0),B=es.reduce((a,e)=>a+e.bill,0),P=ps.reduce((a,p)=>a+p.amt,0),mx=Math.max(1,...D.s.map(s=>bal(s.id)));
window._rw=`Milk ${L.toFixed(1)} L\nBill ${f(B)}\nPaid ${f(P)}\nOutstanding ${f(D.s.reduce((a,s)=>a+bal(s.id),0))}\n`+D.s.map(s=>s.name+': '+f(bal(s.id))).join('\n');
$('#rb').innerHTML=`<div class=grid><div class="card stat"><b>${L.toFixed(1)} L</b><span>Milk</span></div><div class="card stat"><b>${f(B)}</b><span>Amount Payable (bill)</span></div><div class="card stat"><b>${f(P)}</b><span>Amount Paid</span></div></div><div class=card><h2>Supplier Wise / Outstanding</h2>${D.s.map(s=>{const b=bal(s.id);return`<div class=row style="display:block"><div style="display:flex;justify-content:space-between"><span>${s.name}</span><b>${f(b)}</b></div><div class=bt style="width:${Math.max(2,Math.max(0,b)/mx*100)}%"></div></div>`}).join('')||'<p class=mu>Koi supplier nahi.</p>'}</div>`}
const waRep=()=>wa(window._rw);
async function chPin(){if(!(await verify()))return;const n=await ask('Naya PIN (4+ digit)');if(n&&n.length>=4){D.pin=n;save();msg('PIN badal gaya')}}
async function backup(){if(!(await verify()))return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify((({pin,rc,...o})=>o)(D))],{type:'application/json'}));a.download='milk_ledger_backup_'+today()+'.json';a.click()}
async function restore(i){const fl=i.files[0];if(!fl||!(await verify()))return;fl.text().then(t=>{try{const o=JSON.parse(t);if(!o.s||!o.e||!o.p)throw 0;archive();D={...o,pin:D.pin,rc:D.rc,setup:1};save();msg('Restore mukammal');go('home')}catch{msg('Ghalat backup file')}})}
go('lock');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
